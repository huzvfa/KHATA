name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      -       - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt ; exit ${PIPESTATUS[0]}

      - name: Show error in summary if build failed
        if: failure()
        run: |
          echo '## Build error' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "e: file|error:|FAILURE:|Caused by:|What went wrong" build-log.txt | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '--- last 30 lines ---' >> "$GITHUB_STEP_SUMMARY"
          tail -30 build-log.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khata-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
